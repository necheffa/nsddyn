server:
    do-ip4: yes
    port: 53
    username: nsd
    zonesdir: /etc/nsd/zones
    logfile: /var/log/nsd.log
    pidfile: /run/nsd/nsd.pid

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8952

zone:
    name: "example.com"
    zonefile: "example.com.zone"

